syntax = "proto3";
package oracle.v1;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "oracle/v1/oracle.proto";

option go_package = "code.zeeve.net/client-projects/cronos-whitelabelling/x/oracle/types";

// Msg defines the oracle Msg service
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdatePrices updates prices from the price feed contract
  // This is called by authorized relayers to sync prices on-chain
  rpc UpdatePrices(MsgUpdatePrices) returns (MsgUpdatePricesResponse);
  
  // RelayPrice allows authorized relayers to submit prices
  rpc RelayPrice(MsgRelayPrice) returns (MsgRelayPriceResponse);
  
  // UpdateParams updates the module parameters
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // UpdateAuthorizedRelayers updates feeder relayer allow-list (governance authority only)
  rpc UpdateAuthorizedRelayers(MsgUpdateAuthorizedRelayers) returns (MsgUpdateAuthorizedRelayersResponse);
}

// MsgUpdatePrices updates prices for one or more symbols
// This message is typically called by an oracle relayer bot
message MsgUpdatePrices {
  option (cosmos.msg.v1.signer) = "relayer";
  
  // Relayer is the address authorized to update prices
  string relayer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  
  // Symbols are the trading pair symbols (e.g., "ETH/USDT")
  repeated string symbols = 2;
  
  // Prices are the price values (with 8 decimals, integers)
  // Example: 3210.45 USDT = 321045000000
  repeated string prices = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  
  // Timestamp is the prices' timestamp
  int64 timestamp = 4;
}

message MsgUpdatePricesResponse {}

// MsgRelayPrice relays a single price
message MsgRelayPrice {
  option (cosmos.msg.v1.signer) = "relayer";
  
  // Relayer is the address authorized to relay prices
  string relayer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  
  // Symbol is the trading pair symbol (e.g., "ETH/USDT")
  string symbol = 2;
  
  // Price is the price value (with 8 decimals)
  string price = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  
  // Timestamp is the price timestamp
  int64 timestamp = 4;
}

message MsgRelayPriceResponse {}

// MsgUpdateParams updates the module parameters
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  
  // Authority is the address with permission to update params
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  
  // Params contains the new parameters
  Params params = 2 [(gogoproto.nullable) = false];
}

message MsgUpdateParamsResponse {}

// MsgUpdateAuthorizedRelayers updates oracle relayer authorization list.
// This message is governance-authority controlled.
message MsgUpdateAuthorizedRelayers {
  option (cosmos.msg.v1.signer) = "authority";

  // Authority must be the x/gov module address.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Relayers to add to allow-list.
  repeated string add_relayers = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Relayers to remove from allow-list.
  repeated string remove_relayers = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgUpdateAuthorizedRelayersResponse {}
