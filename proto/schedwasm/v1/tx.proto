syntax = "proto3";
package schedwasm.v1;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "schedwasm/v1/types.proto";

option go_package = "code.zeeve.net/client-projects/cronos-whitelabelling/x/schedwasm/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc RegisterContract(MsgRegisterContract) returns (MsgRegisterContractResponse);
  rpc DeregisterContract(MsgDeregisterContract) returns (MsgDeregisterContractResponse);
  rpc UpdateContractParams(MsgUpdateContractParams) returns (MsgUpdateContractParamsResponse);
  rpc DeactivateContract(MsgDeactivateContract) returns (MsgDeactivateContractResponse);
  rpc ReactivateContract(MsgReactivateContract) returns (MsgReactivateContractResponse);
}

// MsgRegisterContract registers a contract for scheduled execution
message MsgRegisterContract {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string contract_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 code_id = 3;
  bool allow_code_id_mismatch = 4;
  bool is_pinned = 5;
  int64 gas_limit = 6;
  int64 gas_price = 7;
  FundingMode funding_mode = 8;
  string granter_address = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgRegisterContractResponse {}

// MsgDeregisterContract deregisters a contract from scheduled execution
message MsgDeregisterContract {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string contract_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgDeregisterContractResponse {}

// MsgUpdateContractParams updates parameters for a registered contract
message MsgUpdateContractParams {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string contract_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 new_gas_limit = 3;
  int64 new_gas_price = 4;
}

message MsgUpdateContractParamsResponse {}

// MsgDeactivateContract deactivates a contract (owner only)
message MsgDeactivateContract {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string contract_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgDeactivateContractResponse {}

// MsgReactivateContract reactivates a deactivated contract (owner only)
message MsgReactivateContract {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string contract_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgReactivateContractResponse {}
